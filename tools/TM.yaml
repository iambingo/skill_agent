identity:
  name: "tm"
  author: "lfenghx"
  label:
    en_US: "skill manager"
    zh_Hans: "技能管理"
    pt_BR: "skill manager"
    ja_JP: "skill manager"
description:
  human:
    en_US: "Manage local skill packages (add/delete/list/download)."
    zh_Hans: "管理本地 skills 技能包：新增/删除/查看/下载"
    pt_BR: "Gerenciar pacotes de habilidades locais (adicionar/remover/visualizar/baixar)."
    ja_JP: "ローカルのスキルパッケージを管理（追加/削除/表示/ダウンロード）"
  llm: "Manage local skill packages (add/delete/list/download)"
parameters:
  - name: project_name
    type: string
    required: true
    label:
      en_US: Project Name
      zh_Hans: 项目名称
      pt_BR: Project Name
      ja_JP: プロジェクト名
    human_description:
      en_US: "Project name used to namespace skills. Each project has its own isolated set of skills."
      zh_Hans: "项目名称，用于隔离不同项目的技能包，不同项目的技能互相独立"
      pt_BR: "Nome do projeto para isolar os pacotes de habilidades."
      ja_JP: "プロジェクト名。スキルを分離するために使用します。"
    llm_description: "Project name to namespace skills"
    form: form
  - name: project_token
    type: secret-input
    required: false
    label:
      en_US: Project Token
      zh_Hans: 项目令牌
      pt_BR: Project Token
      ja_JP: プロジェクトトークン
    human_description:
      en_US: "Access token for the project. Set on first upload to lock the project; required for subsequent write operations."
      zh_Hans: "项目访问令牌。首次新增技能时填写可锁定项目，后续写操作（新增/删除）需提供相同令牌；查看和下载无需令牌"
      pt_BR: "Token de acesso ao projeto."
      ja_JP: "プロジェクトアクセストークン。初回設定後、書き込み操作に必要。"
    llm_description: "Project access token, required for write operations if set"
    form: form
  - name: command
    type: string
    required: true
    label:
      en_US: Command
      zh_Hans: 命令
      pt_BR: Command
      ja_JP: コマンド
    human_description:
      en_US: "supported commands: 查看项目 (list projects), 查看技能 (list skills), 新增技能 (add), 删除技能N (delete), 下载技能N (download)"
      zh_Hans: "支持：查看项目、查看技能、新增技能、删除技能N、下载技能N"
      pt_BR: "Comandos: listar projetos, listar habilidades, adicionar, remover, baixar."
      ja_JP: "コマンド：プロジェクト一覧、スキル一覧、追加、削除N、ダウンロードN"
    llm_description: "supported commands: 查看项目, 查看技能, 新增技能, 删除技能N, 下载技能N"
    form: llm
  - name: files
    type: files
    required: false
    label:
      en_US: Zip files
      zh_Hans: Zip压缩包
      pt_BR: Zip files
      ja_JP: Zipファイル
    human_description:
      en_US: "Zip package(s) for add command."
      zh_Hans: "新增技能时上传 zip 压缩包"
      pt_BR: "Zip package(s) for add command."
      ja_JP: "新增技能 用の zip"
    llm_description: "Zip package(s) for add command"
    form: form
extra:
  python:
    source: tools/TM.py
